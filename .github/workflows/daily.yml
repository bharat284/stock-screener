name: Daily screener

on:
  schedule:
    - cron: "30 2 * * *"   # 08:00 IST (GitHub may start scheduled runs a few minutes late)
  workflow_dispatch:        # "Run workflow" button for a manual refresh

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # ~500 stocks x 4 polite requests ≈ 60 min
    env:
      TZ: Asia/Kolkata
      PYTHONUNBUFFERED: "1"   # stream progress to the Actions log as it happens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python screener.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
